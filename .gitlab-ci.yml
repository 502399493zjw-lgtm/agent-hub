# ═══════════════════════════════════════════════
# GitLab CI/CD Pipeline for Agent Hub
# ═══════════════════════════════════════════════

# 定义构建阶段
stages:
  - lint
  - build
  - docker

# 全局变量
variables:
  # Node.js 版本
  NODE_VERSION: "22"
  # npm 镜像源（淘宝镜像）
  NPM_REGISTRY: "https://registry.npmmirror.com"
  # Docker 镜像仓库配置（根据实际情况修改）
  DOCKER_REGISTRY: "registry.gitlab.com"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE"
  # 缓存配置
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# 缓存配置 - lint 和 build 共享依赖
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm/

# 触发规则：手动触发或 release/ 分支推送
workflow:
  rules:
    # 手动触发（Web UI 或 API）
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    # release/ 分支推送自动触发
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*$/'

# ═══════════════════════════════════════════════
# Stage 1: Lint
# ═══════════════════════════════════════════════
lint:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  before_script:
    # 配置淘宝镜像源
    - npm config set registry $NPM_REGISTRY
    # 安装依赖（优先使用缓存）
    - |
      if [ ! -d "node_modules" ]; then
        echo "Installing dependencies from $NPM_REGISTRY..."
        npm ci
      else
        echo "Using cached node_modules"
      fi
  script:
    - echo "Running ESLint..."
    - npm run lint
  only:
    - web
    - api
    - /^release\/.*$/

# ═══════════════════════════════════════════════
# Stage 2: Build
# ═══════════════════════════════════════════════
build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  before_script:
    # 配置淘宝镜像源
    - npm config set registry $NPM_REGISTRY
    # 安装依赖（复用 lint 阶段的缓存）
    - |
      if [ ! -d "node_modules" ]; then
        echo "Installing dependencies from $NPM_REGISTRY..."
        npm ci
      else
        echo "Using cached node_modules"
      fi
  script:
    - echo "Building Next.js application..."
    - npm run build
    - echo "Build completed successfully"
  artifacts:
    name: "build-$CI_COMMIT_SHORT_SHA"
    paths:
      - .next/
      - public/
      - package.json
      - package-lock.json
    expire_in: 1 hour
  only:
    - web
    - api
    - /^release\/.*$/

# ═══════════════════════════════════════════════
# Stage 3: Docker Build & Push
# ═══════════════════════════════════════════════
docker:
  stage: docker
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    # 从 release/1.2.3 中提取版本号
    VERSION: ${CI_COMMIT_REF_NAME#release/}
  before_script:
    # 配置 Docker Registry 认证（GitLab Container Registry）
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - echo "Building Docker image with Kaniko..."
    - echo "Image tags:latest, ${VERSION}, ${CI_COMMIT_SHORT_SHA}"
    # 使用 Kaniko 构建并推送镜像
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile.ci" \
        --destination "${DOCKER_IMAGE}:latest" \
        --destination "${DOCKER_IMAGE}:${VERSION}" \
        --destination "${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA}" \
        --cache=true \
        --cleanup
  dependencies:
    - build
  only:
    - web
    - api
    - /^release\/.*$/
