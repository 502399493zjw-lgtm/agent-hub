# ═══════════════════════════════════════════════
# GitLab CI/CD Pipeline for Agent Hub
# ═══════════════════════════════════════════════

# 定义构建阶段
stages:
  - lint
  - build
  - docker

# 全局变量
variables:
  # 镜像仓库
  DOCKER_REGISTRY: "hub.stepfun-inc.com/busi"
  # npm 镜像源（淘宝镜像）
  NPM_REGISTRY: "https://registry.npmmirror.com"
  # 缓存配置
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# 缓存配置 - lint 和 build 共享依赖
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm/

# 触发规则：手动触发或 release/ 分支推送
workflow:
  rules:
    # 手动触发（Web UI 或 API）
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    # release/ 分支推送自动触发
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*$/'

# ═══════════════════════════════════════════════
# Stage 1: Lint
# ═══════════════════════════════════════════════
lint:
  stage: lint
  image: hub.stepfun-inc.com/ndp-data/node-build:22-alpine
  before_script:
    # 配置淘宝镜像源
    - npm config set registry $NPM_REGISTRY
    # 安装依赖（总是执行 npm ci，利用缓存加速）
    - echo "Installing dependencies from $NPM_REGISTRY..."
    - npm ci
  script:
    - echo "Running ESLint..."
    - npm run lint
  only:
    - web
    - api
    - /^release\/.*$/

# ═══════════════════════════════════════════════
# Stage 2: Build
# ═══════════════════════════════════════════════
build:
  stage: build
  image: hub.stepfun-inc.com/ndp-data/node-build:22-alpine
  before_script:
    # 配置淘宝镜像源
    - npm config set registry $NPM_REGISTRY
    # 安装依赖（总是执行 npm ci，利用缓存加速）
    - echo "Installing dependencies from $NPM_REGISTRY..."
    - npm ci
  script:
    - echo "Building Next.js application..."
    - npm run build
    - echo "Build completed successfully"
  artifacts:
    name: "build-$CI_COMMIT_SHORT_SHA"
    paths:
      - .next/
      - public/
      - package.json
      - package-lock.json
    expire_in: 1 hour
  only:
    - web
    - api
    - /^release\/.*$/

# ═══════════════════════════════════════════════
# Stage 3: Docker Build & Push
# ═══════════════════════════════════════════════
docker:
  stage: docker
  image:
    name: hub.stepfun-inc.com/devops/stepbase-kaniko:latest
    entrypoint: [""]
  script:
    - echo "Branch: ${CI_COMMIT_BRANCH}"
    - echo "Commit SHA: ${CI_COMMIT_SHORT_SHA}"
    - echo "Project: ${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}"
    - export APP_PATH=$(echo ${CI_PROJECT_NAMESPACE} | tr '/' '-')
    - export IMAGE_TAG="${DOCKER_REGISTRY}/${APP_PATH}-${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}"
    - echo "✓ Image tag: ${IMAGE_TAG}"
    # 使用 Kaniko 构建并推送镜像
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${IMAGE_TAG}" \
        --cache=true \
        --cleanup
  dependencies:
    - build
  only:
    - web
    - api
    - /^release\/.*$/
